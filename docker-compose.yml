services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-varzea_pro}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-local-only}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-True}
      DB_NAME: ${DB_NAME:-varzea_pro}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./api:/app
    ports:
      - "${API_PORT_HOST:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./front
    environment:
      API_URL: ${API_URL:-http://localhost:8000/api}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
    volumes:
      - ./front:/app
      - frontend_node_modules_v58:/app/node_modules
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    depends_on:
      - api
    command: >-
      sh -c 'printf "API_URL=%s\nBASE_URL=%s\n" "$$API_URL" "$$BASE_URL" > .env &&
      npx expo start --lan --port 8081'

volumes:
  postgres_data:
  frontend_node_modules_v58:
